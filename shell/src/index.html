<html>

<head>
    <title>Takase :: $SHELL</title>
    <link rel="stylesheet" href="index.css">
    <script type="application/javascript" src="index.js"></script>
</head>

<body>
    <div class="container">
        <div class="terminal" id="terminal"></div>
        <footer class="terminal-footer">
            <div class="footer-left">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text" class="status-text">Not running</span>
            </div>

            <div class="footer-right">
                <div class="bytes-container">
                    <span class="current-file" id="current-file"></span>
                    <span id="total-tx">0B transferred</span>

                    <!-- Popover -->
                    <div class="stats-popover">
                        <div class="popover-row">
                            <span class="popover-label">WASM:</span>
                            <span id="wasm-tx" class="popover-value">&nbsp;</span>
                        </div>
                        <div class="popover-row">
                            <span class="popover-label">Container:</span>
                            <span id="blob-tx" class="popover-value">&nbsp;</span>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">&nbsp;</h3>
            <p id="modal-content">&nbsp;</p>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="modal-ok" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <noscript>
        <div id="modal" class="modal-overlay">
            <div class="modal-card">
                <p id="modal-content" style="vertical-align: middle; text-align: center; margin: 0;">JavaScript is
                    needed for this functionality.</p>
            </div>
        </div>
    </noscript>
</body>

</html>
